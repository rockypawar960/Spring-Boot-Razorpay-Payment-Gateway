<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Razorpay Payment Gateway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container" style="width: 50%;">
    <main style="margin-bottom: 5rem;">
        <div class="py-5 text-center">
            <img class="d-block mx-auto mb-4" src="https://getbootstrap.com/docs/5.0/assets/brand/bootstrap-logo.svg"
                 alt="" width="72" height="57">
            <h2>Checkout form</h2>
            <p class="lead">Razorpay payment integration example built with Spring Boot (UPI, Cards, Netbanking).</p>
        </div>

        <div class="row g-5">
            <div class="col-md-5 col-lg-4 order-md-last">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                    <span>Your cart</span>
                    <span class="badge bg-danger rounded-pill">1</span>
                </h4>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between lh-sm">
                        <div>
                            <h6 class="my-0">Product name</h6>
                            <small class="text-muted">Shirt</small>
                        </div>
                        <span class="text-muted">₹50</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>Total (INR)</span>
                        <strong>₹50</strong>
                    </li>
                </ul>
            </div>
            <div class="col-md-7 col-lg-8">
                <h4 class="mb-3">Payment</h4>
                <button id="payBtn" type="button" class="w-100 btn btn-primary btn-lg">Pay ₹50</button>
            </div>
        </div>
    </main>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    document.getElementById('payBtn').onclick = async () => {
        const res = await fetch('/pay/create-order', { method: 'POST' });
        if (!res.ok) { alert('Order create nahi hua'); return; }
        const d = await res.json();

        const rzp = new Razorpay({
            key: d.key,
            amount: d.amount,
            currency: 'INR',
            name: 'Demo Shop',
            description: 'Shirt',
            order_id: d.orderId,
            handler: async (r) => {
                const v = await fetch('/pay/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(r)
                });
                if (v.ok) window.location = '/success';
                else alert('Payment verify nahi hua');
            }
        });
        rzp.open();
    };
</script>
</body>

</html>
